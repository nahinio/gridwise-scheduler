name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only commits must not move the published image away from the digest pinned in README.
    paths-ignore: ["**.md", "docs/**", "evals/**", "deploy/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gridwise-scheduler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only published if it behaves like the production service: it must start
      # with NO keys, turn /health green, and pass the acceptance runner on the public pack.
      - name: Start container (no secrets)
        run: docker run -d --name gridwise -p 8000:8000 gridwise-scheduler:ci

      - name: Wait for /health (60 s budget)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs gridwise; exit 1

      - uses: astral-sh/setup-uv@v6
      - name: Acceptance runner against the container
        run: |
          uv sync --frozen
          uv run python -m tools.check --url http://localhost:8000 --edge

      - name: Image must not contain secrets or dev files
        run: |
          docker exec gridwise sh -c 'test ! -e /srv/.env && ! env | grep -Ei "api_key=."'
          ! docker history --no-trunc gridwise-scheduler:ci | grep -Ei "sk-[a-z0-9]{8}|api_key=[^ ]"

      - name: Container logs
        if: always()
        run: docker logs gridwise | tail -n 40

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - id: push
        name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Publish the digest to pin in README / submission
        run: |
          {
            echo "### Pullable image"
            echo '```'
            echo "docker pull ${IMAGE}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo "Tags:"
            echo '${{ steps.meta.outputs.tags }}'
          } >> "$GITHUB_STEP_SUMMARY"
